name: Mi primer pipeline CI-CD

on:
  push:
    branches:
      - main

jobs:
  verificar:
    name: Verificar repositorio
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Mostrar mensaje
        run: echo "La integracion continua esta funcionando"

      - name: Verificar que README no este vacio
        run: test -s README.md

  desplegar:
    name: Simular despliegue
    needs: verificar
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar despliegue
        run: echo "El despliegue simulado termino correctamente"